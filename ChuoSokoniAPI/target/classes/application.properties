# =============================================================================
# Server Configuration
# =============================================================================
server.port=8080
server.servlet.context-path=/api/v1

# =============================================================================
# PostgreSQL Database Connection Settings
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/chuo_sokoni_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# =============================================================================
# JPA / Hibernate Configurations
# =============================================================================
# Do not auto-generate DDL since schema is already managed via 01_schema_tables.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================================================
# Application & Security Settings
# =============================================================================
# JWT Secret Key (Must be at least 256 bits / 32 characters for HMAC-SHA256)
app.jwt.secret=ChuoSokoni2026SecretKeyForJWTAuthenticationAndAuthorizationTokenGenerationSystem123456
app.jwt.expiration-ms=86400000

# Default Business Settings (as defined in the SRS)
app.business.default-referral-code=CHUO_DEFAULT
app.business.direct-retail-agent-fee=500.00
app.business.holding-fee-grace-days=14